<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>녹기 전에 잘 담기</title>
<style>
:root{--bg:#fafaf8;--ink:#1a1f24;--sub:#8a939a;--line:#e4e6e8;--acc:#2a4b7e;--btn:#2a4b7e;--btnt:#fff;--lgf:none;--ovbg:rgba(255,255,255,.28);--wmf:grayscale(1) opacity(.35);--wmfr:none;--bgpf:grayscale(1) opacity(.05);--tstc:#3b2f27;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101418;--ink:#eef1f3;--sub:#7d8991;--line:#242b31;--acc:#7ea4e0;--btn:#7ea4e0;--btnt:#0f1a2b;--lgf:brightness(0) invert(.93);--ovbg:rgba(16,20,24,.24);--wmf:brightness(0) invert(1) opacity(.55);--wmfr:brightness(0) invert(1);--bgpf:brightness(0) invert(1) opacity(.08);--tstc:#fff}}
:root[data-theme="dark"]{--bg:#101418;--ink:#eef1f3;--sub:#7d8991;--line:#242b31;--acc:#7ea4e0;--btn:#7ea4e0;--btnt:#0f1a2b;--lgf:brightness(0) invert(.93);--ovbg:rgba(16,20,24,.24);--wmf:brightness(0) invert(1) opacity(.55);--wmfr:brightness(0) invert(1);--bgpf:brightness(0) invert(1) opacity(.08);--tstc:#fff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;display:flex;flex-direction:column;position:relative}
#bgpat{position:fixed;inset:-35%;background-repeat:no-repeat;background-size:100% 100%;transform:rotate(-22deg);transform-origin:center;filter:var(--bgpf);pointer-events:none;z-index:-1}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 20px 12px;font-size:12px;color:var(--sub)}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink);font-size:14.5px;font-weight:700}
#lg{height:24px;width:auto;filter:var(--lgf)}
#hint{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13.5px;color:var(--sub);white-space:pre-line;line-height:1.55;text-align:center;padding:6px 24px;min-height:54px;animation:hintBlink 2.2s ease-in-out infinite}
@keyframes hintBlink{0%,100%{opacity:1}50%{opacity:.12}}
@media (prefers-reduced-motion:reduce){#hint{animation:none}}
#stage{flex:1;position:relative;min-height:0;margin:0 20px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);overflow:hidden}
.confetti{position:absolute;top:40%;left:50%;width:7px;height:12px;border-radius:2px;opacity:0;z-index:6;pointer-events:none;will-change:transform,opacity;animation:confettiFall var(--dur,1100ms) cubic-bezier(.15,.6,.4,1) forwards}
@keyframes confettiFall{0%{opacity:1;transform:translate(-50%,-50%) rotate(0deg) scale(1)}100%{opacity:0;transform:translate(calc(-50% + var(--dx,0px)),calc(-50% + var(--dy,220px))) rotate(var(--rot,540deg)) scale(.6)}}
@media (prefers-reduced-motion:reduce){.confetti{display:none}}
#bubble{position:absolute;left:0;top:0;transform:translate(-999px,-999px);pointer-events:none;background:rgba(255,255,255,.94);color:#3b2f27;font-size:11.5px;font-weight:600;padding:7px 12px;border-radius:999px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.16);opacity:0;transition:opacity .25s}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;transform:perspective(1000px) rotateY(0deg);transition:transform .55s cubic-bezier(.22,.7,.28,1);will-change:transform}
@media (prefers-reduced-motion:reduce){canvas{transition:none}}
#scoreOv{display:none;position:absolute;left:50%;bottom:2px;transform:translateX(-50%);flex-direction:column;align-items:center;gap:2px;pointer-events:none;z-index:2;max-width:82%}
#liveScore{display:none;position:absolute;top:10px;left:50%;transform:translateX(-50%);padding:4px 16px;border-radius:14px;background:var(--ovbg);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:3;pointer-events:none;overflow:visible}
#liveScoreTxt{display:inline-block;font-size:20px;font-weight:800;color:var(--acc);font-variant-numeric:tabular-nums;transform-origin:top center;transition:transform .12s ease,opacity .12s ease}
#pct{font-size:43px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;color:var(--acc);padding:6px 22px;border-radius:20px;background:var(--ovbg);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);box-shadow:0 4px 18px rgba(0,0,0,.08);white-space:nowrap}
#msg{font-size:12px;color:var(--sub);white-space:pre-line;line-height:1.4}
#nm{font-size:14.5px;font-weight:600;white-space:pre-line;line-height:1.4;color:var(--acc)}
footer{height:132px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:6px 24px;gap:20px}
#credit{position:absolute;left:0;right:0;bottom:8px;font-size:10.5px;color:var(--sub);opacity:.55;letter-spacing:.01em}
#res{display:none;flex-direction:column;align-items:center}
#wordmark{height:24px;width:auto;filter:var(--wmf);transition:filter .3s ease}
#wordmark.reveal{filter:var(--wmfr)}
#again{border:0;border-radius:999px;background:var(--btn);color:var(--btnt);font-family:inherit;font-size:15px;font-weight:600;padding:10px 26px}
#again:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
</style>
</head>
<body>
<div id="bgpat"></div>
<header><div class="brand"><img id="lg" alt="로고"><span>녹기 전에 잘 담기</span></div><span>최고 <b id="best">-</b></span></header>
<div id="hint"></div>
<div id="stage"><canvas id="c"></canvas><div id="bubble"></div><div id="liveScore"><span id="liveScoreTxt">--</span></div><div id="scoreOv"><div id="pct">0점!</div><div id="nm"></div><div id="msg"></div></div></div>
<footer>
<img id="wordmark" alt="Before it melts."><div id="res"><button id="again" type="button">다시 해봅니다,,</button></div>
<div id="credit">Made by 녹건</div>
</footer>
<script>
const DATA=/*DATA*/[{"n": "바닐라 비스킷", "s": "a/951fd3b03052.jpg"}, {"n": "요거트 크림", "s": "a/edc1b1fce956.jpg"}, {"n": "피스타치오", "s": "a/4d2dc8ce0cab.jpg"}, {"n": "콘플레이크 밀크", "s": "a/65098d267de8.jpg"}, {"n": "말차 초콜릿", "s": "a/98b30f6de37f.jpg"}, {"n": "드래곤프루트", "s": "a/f403af01c54f.jpg"}, {"n": "블랙베리 리플", "s": "a/69f4da2e3b89.jpg"}, {"n": "초코 컨페티", "s": "a/29554fe81e17.jpg"}, {"n": "라즈베리 소르베", "s": "a/c59cea4beadf.jpg"}, {"n": "초코민트칩", "s": "a/fedcdfd28211.jpg"}, {"n": "레인보우 쿠키도우", "s": "a/445f6eb13a5e.jpg"}, {"n": "바나나 피칸", "s": "a/ff6cab00cd29.jpg"}, {"n": "카페모카", "s": "a/0c438d4200f7.jpg"}, {"n": "블루 스위트크림", "s": "a/c589bbd34fc7.jpg"}, {"n": "스트로베리 쇼트케이크", "s": "a/23982f690da5.jpg"}, {"n": "말차 모찌", "s": "a/fb9fa6bf0811.jpg"}, {"n": "로즈 피그 리플", "s": "a/b207ba4f82bb.jpg"}, {"n": "브라우니 청크", "s": "a/f0561ca6e619.jpg"}, {"n": "피넛버터 그래놀라", "s": "a/961c98e969a5.jpg"}, {"n": "허브 크림", "s": "a/695070b11fd6.jpg"}, {"n": "말차 초코 스월", "s": "a/5d9400cf7e84.jpg"}, {"n": "피치 바닐라", "s": "a/e9946869868f.jpg"}, {"n": "체리 리플 크림", "s": "a/263d1e981048.jpg"}, {"n": "애프리콧 바닐라빈", "s": "a/6a3061df968b.jpg"}, {"n": "핑크 구아바", "s": "a/ef7c711aa847.jpg"}];
const LOGO=/*LOGO*/"a/5a9c54b99851.png";
const LOGO2=/*LOGO2*/"a/afdf26b7be14.png";
document.getElementById('lg').src=LOGO;
document.getElementById('wordmark').src=LOGO2;
(function(){const tw=230,th=105,iw=156,ih=iw*90/755;const x=(tw-iw)/2,y=(th-ih)/2;
const svg='<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%"><defs><pattern id="p" width="'+tw+'" height="'+th+'" patternUnits="userSpaceOnUse"><image href="'+LOGO2+'" x="'+x+'" y="'+y+'" width="'+iw+'" height="'+ih+'"/></pattern></defs><rect width="100%" height="100%" fill="url(#p)"/></svg>';
document.getElementById('bgpat').style.backgroundImage='url("data:image/svg+xml;base64,'+btoa(svg)+'")'})();
document.documentElement.style.setProperty('--logo','url("'+LOGO+'")');
const imgs=DATA.map(d=>{const i=new Image();i.src=d.s;return i});
const logoImg=new Image();logoImg.src=LOGO;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const hint=$('hint'),res=$('res'),scoreOv=$('scoreOv'),liveScoreEl=$('liveScore'),liveScoreTxt=$('liveScoreTxt'),SK='#3b2f27';
function showLive(){liveScoreEl.style.display='block'}
function hideLive(){liveScoreEl.style.display='none'}
function liveCircleScore(){if(pts.length<6)return null;
const gR=Math.min(W,H)*.3,gcx=W/2,gcy=H/2;let sum=0;
for(const p of pts){const dg=Math.hypot(p.x-gcx,p.y-gcy)-gR;sum+=dg*dg}
const dev=Math.sqrt(sum/pts.length)/gR;
const raw=Math.max(0,Math.min(100,100*(1-dev*4.2)));
const ramp=Math.min(1,(pts.length-6)/18);
return raw*ramp+100*(1-ramp)}
function liveLineScore(){if(lp.length<4||!circ||!circ.guide)return null;
const f=circ.f,inside=lp.filter(p=>Math.hypot(p.x-f.cx,p.y-f.cy)<=f.R);
if(inside.length<4)return null;
const g=circ.guide,N=24,gsamp=[];
for(let i=0;i<=N;i++){const t=i/N,mt=1-t;gsamp.push({x:mt*mt*g.p0.x+2*mt*t*g.ctrl.x+t*t*g.p1.x,y:mt*mt*g.p0.y+2*mt*t*g.ctrl.y+t*t*g.p1.y})}
const nearest=(pt,arr)=>{let m=1e9;for(const q of arr){const dd=Math.hypot(pt.x-q.x,pt.y-q.y);if(dd<m)m=dd}return m};
let sum=0;for(const p of inside)sum+=nearest(p,gsamp);sum/=inside.length;
const avgDev=sum/f.R;
return Math.max(0,Math.min(100,100*(1-avgDev*3.4)))}
function updateLive(s){if(s==null){liveScoreTxt.textContent='--';liveScoreTxt.style.transform='none';liveScoreTxt.style.opacity=1;return}
liveScoreTxt.textContent=(Math.round(s*10)/10).toFixed(1)+'%';
const t=Math.max(0,Math.min(1,(100-s)/100));
liveScoreTxt.style.transform='scaleY('+(1+t*.6).toFixed(2)+') skewX('+(-t*7).toFixed(1)+'deg) translateY('+(t*5).toFixed(1)+'px)';
liveScoreTxt.style.opacity=(1-t*.3).toFixed(2)}
const CONFETTI_C=['#2a4b7e','#f2b6c6','#efe9ac','#c9c179','#eef1f2','#a9713c','#7ea4e0','#e8e2d0'];
function confettiBurst(){const stage=$('stage'),n=30;
for(let i=0;i<n;i++){const el=document.createElement('div');el.className='confetti';
const ang=Math.random()*Math.PI*2,dist=90+Math.random()*140;
el.style.setProperty('--dx',(Math.cos(ang)*dist).toFixed(0)+'px');
el.style.setProperty('--dy',(Math.sin(ang)*dist*.7-40).toFixed(0)+'px');
el.style.setProperty('--rot',(360+Math.random()*540).toFixed(0)+'deg');
el.style.setProperty('--dur',(900+Math.random()*500).toFixed(0)+'ms');
el.style.background=CONFETTI_C[i%CONFETTI_C.length];
el.style.left=(50+(Math.random()*30-15))+'%';
el.style.animationDelay=(Math.random()*120)+'ms';
stage.appendChild(el);
el.addEventListener('animationend',()=>el.remove())}}
let W=0,H=0,pts=[],lp=[],circ=null,phase='idle',deck=[],raf=0,cRaf=0;
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const ease=t=>1-Math.pow(1-Math.max(0,Math.min(1,t)),3);
const H1='①번, 원 그리기,,\n크게 한 바퀴 그려주시면 됩니다,,';
function resize(){const r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);if(phase!=='drawing1'&&phase!=='drawing2')reset()}
function say(t){res.style.display='none';scoreOv.style.display='none';hideLive();cv.style.transition='transform .4s ease';rotDeg=-15;setTilt(0);$('wordmark').classList.remove('reveal');hint.textContent=t}
function reset(){cancelAnimationFrame(raf);phase='idle';pts=[];lp=[];circ=null;ctx.clearRect(0,0,W,H);guide1();say(H1)}
function trace(a){ctx.beginPath();a.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y))}
function stroke(a,w,c,close){trace(a);if(close)ctx.closePath();ctx.lineWidth=w;ctx.lineCap=ctx.lineJoin='round';ctx.strokeStyle=c;ctx.stroke()}
function guide1(act){const r=Math.min(W,H)*.3;if(!act){ctx.save();ctx.lineCap='round';ctx.lineWidth=3;ctx.strokeStyle=css('--sub');ctx.globalAlpha=.45;ctx.setLineDash([2,9]);ctx.beginPath();ctx.arc(W/2,H/2,r,0,7);ctx.stroke();ctx.setLineDash([]);ctx.beginPath();ctx.arc(W/2,H/2,3.5,0,7);ctx.fillStyle=css('--sub');ctx.fill();ctx.restore();return}const bt=(performance.now()/2200)%1,k=.5*(1+Math.cos(bt*2*Math.PI)),bA=.42+.58*k,dark=css('--bg')==='#101418';
const c0=dark?[126,164,224]:[59,47,39],c1=[47,128,255],col='rgb('+c0.map((v,i)=>Math.round(v+(c1[i]-v)*k)).join(',')+')';
ctx.save();ctx.lineCap='round';ctx.setLineDash([2,9]);
ctx.lineWidth=6.5;ctx.strokeStyle='rgba(255,255,255,.95)';ctx.globalAlpha=Math.min(1,bA+.3)*(dark?.55:1);
ctx.beginPath();ctx.arc(W/2,H/2,r,0,7);ctx.stroke();
ctx.lineWidth=3.8;ctx.strokeStyle=col;ctx.globalAlpha=bA;
ctx.beginPath();ctx.arc(W/2,H/2,r,0,7);ctx.stroke();
ctx.setLineDash([]);ctx.globalAlpha=Math.min(1,bA+.2);ctx.beginPath();ctx.arc(W/2,H/2,4,0,7);ctx.fillStyle=col;ctx.fill();ctx.restore()}
function guide2(){const g=circ.guide;if(!g)return;
const bt=(performance.now()/2200)%1,k=.5*(1+Math.cos(bt*2*Math.PI)),bA=.42+.58*k;
const c0=[59,47,39],c1=[47,128,255],col='rgb('+c0.map((v,i)=>Math.round(v+(c1[i]-v)*k)).join(',')+')';
ctx.save();ctx.lineCap='round';ctx.setLineDash([2,9]);
ctx.lineWidth=6.5;ctx.strokeStyle='rgba(255,255,255,.95)';ctx.globalAlpha=Math.min(1,bA+.3);
ctx.beginPath();ctx.moveTo(g.p0.x,g.p0.y);ctx.quadraticCurveTo(g.ctrl.x,g.ctrl.y,g.p1.x,g.p1.y);ctx.stroke();
ctx.lineWidth=3.8;ctx.strokeStyle=col;ctx.globalAlpha=bA;
ctx.beginPath();ctx.moveTo(g.p0.x,g.p0.y);ctx.quadraticCurveTo(g.ctrl.x,g.ctrl.y,g.p1.x,g.p1.y);ctx.stroke();
ctx.setLineDash([]);
ctx.fillStyle=col;ctx.globalAlpha=Math.min(1,bA+.2);[g.p0,g.p1].forEach(p=>{ctx.beginPath();ctx.arc(p.x,p.y,4,0,7);ctx.fill()});
ctx.restore()}
function companion(x,y){const t=performance.now(),frame=Math.floor(t/320)%3;
const ox=-92+Math.sin(t*.005)*3,oy=-34+Math.cos(t*.0043)*3;
const ang=[.55,0,-.4][frame],lift=[2,-4,1][frame];
ctx.save();ctx.translate(x+ox,y+oy);ctx.scale(2,2);ctx.lineJoin='round';ctx.lineCap='round';
ctx.fillStyle='#efe5d0';ctx.strokeStyle=SK;ctx.lineWidth=1;
ctx.beginPath();ctx.moveTo(-7,6);ctx.lineTo(-5,13);ctx.lineTo(5,13);ctx.lineTo(7,6);ctx.closePath();ctx.fill();ctx.stroke();
ctx.save();ctx.translate(0,-2+lift);ctx.rotate(ang);
ctx.fillStyle='#a9713c';ctx.beginPath();if(ctx.roundRect)ctx.roundRect(-1.5,-13,3.0,9,1.4);else ctx.rect(-1.5,-13,3.0,9);ctx.fill();ctx.stroke();
const g=ctx.createLinearGradient(-2.7,-5.1,2.7,1.5);g.addColorStop(0,'#eef1f2');g.addColorStop(1,'#aeb6ba');
ctx.beginPath();ctx.ellipse(0,-1.8,2.7,3.3,0,0,7);ctx.fillStyle=g;ctx.fill();ctx.lineWidth=1;ctx.stroke();
if(frame===1){ctx.beginPath();ctx.ellipse(-0.2,-2.3,1.2,1.6,0,0,7);ctx.fillStyle='#f2b6c6';ctx.fill()}
ctx.restore();ctx.restore()}
function tipGlow(a){if(!a.length)return;const p=a[a.length-1],t=performance.now(),puls=.55+.45*Math.sin(t*.012);
let len=0;for(let i=1;i<a.length;i++)len+=Math.hypot(a[i].x-a[i-1].x,a[i].y-a[i-1].y);
const pr=Math.min(1,len/(Math.min(W,H)*1.6)),r=30*puls+30,L=(40+14*puls)*(1+.15*pr);
ctx.save();
const rg=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,r);
rg.addColorStop(0,'rgba(255,255,255,'+(.3+.35*pr).toFixed(2)+')');rg.addColorStop(1,'rgba(255,244,200,0)');
ctx.fillStyle=rg;ctx.beginPath();ctx.arc(p.x,p.y,r,0,7);ctx.fill();
ctx.beginPath();for(let i=0;i<8;i++){const a0=i*Math.PI/4-Math.PI/2,a1=a0+Math.PI/8,ri=L*.2;
ctx.lineTo(p.x+Math.cos(a0)*L,p.y+Math.sin(a0)*L);ctx.lineTo(p.x+Math.cos(a1)*ri,p.y+Math.sin(a1)*ri)}
ctx.closePath();ctx.fillStyle='rgba(255,255,255,'+(.72+.26*pr).toFixed(2)+')';ctx.fill();ctx.strokeStyle='rgba(255,236,170,'+(.8+.2*pr).toFixed(2)+')';ctx.lineWidth=1.4;ctx.lineJoin='miter';ctx.stroke();
ctx.restore()}
const SHIMMER_PAL=['#3b82f6','#7dd3fc','#60a5fa','#93c5fd','#38bdf8','#a5f3fc'];
function shimmerLine(a){if(a.length<2)return;const t=performance.now();
const step=Math.max(1,Math.floor(a.length/28));
for(let i=0;i<a.length;i+=step){const p=a[i];
const phase=t*.006+i*.42;
const tw=(Math.sin(phase)+1)/2;
if(tw<.15)continue;
const col=SHIMMER_PAL[i%SHIMMER_PAL.length];
const rad=(2.2+tw*3.4);
ctx.save();ctx.globalAlpha=.22+tw*.5;
const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,rad*2.4);
g.addColorStop(0,col);g.addColorStop(1,'rgba(0,0,0,0)');
ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,rad*2.4,0,7);ctx.fill();ctx.restore()}}
function drawCursor(a){if(!a.length)return;const p=a[a.length-1];tipGlow(a);companion(p.x,p.y)}
const bubbleEl=$('bubble');
function showBubble(p){bubbleEl.textContent='즈희는,,이것을 스쿠핑이라,, 부르고 있읍니다,,';moveBubble(p);bubbleEl.style.opacity='1'}
function moveBubble(p){const x=Math.max(70,Math.min(W-70,p.x+26));bubbleEl.style.transform='translate('+x+'px,'+Math.max(20,p.y-84)+'px) translateX(-50%)'}
function hideBubble(){bubbleEl.style.opacity='0'}
function draw1(){ctx.clearRect(0,0,W,H);guide1(true);
stroke(pts,5,css('--acc'));
drawCursor(pts)}
function draw2(a){scene(0,0,a===undefined?1:a);
if(lp.length>1){stroke(lp,6,'#fff');stroke(lp,3.5,SK)}
drawCursor(lp);guide2()}
function pos(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function liveLoop(){if(phase==='drawing1'){draw1();updateLive(liveCircleScore());cRaf=requestAnimationFrame(liveLoop)}else if(phase==='drawing2'){draw2();updateLive(liveLineScore());cRaf=requestAnimationFrame(liveLoop)}}
let sweep=0,lastAng=0;
let rotDeg=-15,rotDrag=false,rotStartX=0,rotStartDeg=-15;
function setTilt(deg){cv.style.transform='perspective(1000px) rotateY('+deg+'deg)'}
cv.addEventListener('pointerdown',e=>{
