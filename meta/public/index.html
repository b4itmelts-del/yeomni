<body><div id="ld"><img src="a/2428855dbd5b.png" alt="녹기전에"><div>처음 접속하시면 로딩이 조금 오래 걸리는 점<br>양해 부탁드립니다,,</div><div id="bar"><i></i></div><div id="pc">0%</div></div>
<script>
(function(){ var F=[['three.min.js',603445],['dio.js',927378],['game.html',1412575]], got=[0,0,0], tot=F[0][1]+F[1][1]+F[2][1], bar=document.querySelector('#bar i'), pc=document.getElementById('pc');
 function up(){ var p=Math.min(99,Math.floor((got[0]+got[1]+got[2])/tot*100)); bar.style.width=p+'%'; pc.textContent=p+'%'; }
 function get(i){ return fetch(F[i][0]).then(function(r){ if(!r.ok) throw 0; if(!r.body||!window.TextDecoder) return r.text().then(function(t){ got[i]=F[i][1]; up(); return t; });
   var rd=r.body.getReader(), dec=new TextDecoder(), txt=''; return (function pump(){ return rd.read().then(function(x){ if(x.done){ txt+=dec.decode(); got[i]=F[i][1]; up(); return txt; } got[i]+=x.value.length; up(); txt+=dec.decode(x.value,{stream:true}); return pump(); }); })(); }); }
 Promise.all([get(0),get(1),get(2)]).then(function(T){ var h=T[2].replace('<script src="three.min.js"><\/script>',function(){ return '<script>'+T[0]+'\n<\/script>'; }).replace('<script src="dio.js"><\/script>',function(){ return '<script>'+T[1]+'\n<\/script>'; });
   bar.style.width='100%'; pc.textContent='100%'; setTimeout(function(){ document.open(); document.write(h); document.close(); },40); })
 .catch(function(){ location.replace('game.html'); });
})();
</script></body></html>
