<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>가기전에,, v0.1</title>
<style>html,body{margin:0;height:100%;background:#ffffff}#ld{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font:600 14px/1.6 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#285686;text-align:center;padding:0 24px;background:#ffffff}#ld img{width:min(62vw,420px);height:auto;transform:translateY(-5vh)}#bar{width:min(60vw,260px);height:10px;border:3px solid currentColor;background:#fff}#bar i{display:block;height:100%;width:0;background:#285686}#pc{font-size:12px;opacity:.7;margin-top:-8px}#bt{position:absolute;left:0;right:0;bottom:calc(9vh + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:16px}</style></head>
<body><div id="ld"><img src="a/2428855dbd5b.png" alt="녹기전에"><div id="bt"><div>처음 접속하시면 로딩이 조금 오래 걸리는 점<br>양해 부탁드립니다,,</div><div id="bar"><i></i></div><div id="pc">0%</div></div></div>
<script>
(function(){ var e=document.getElementById('ld'), h=new Date().getHours(); if(h>=18||h<6){ document.documentElement.style.background=document.body.style.background=e.style.background='#10153c'; e.style.color='#e9e4f2'; e.querySelector('img').style.filter='brightness(0) invert(.95)'; }   /* evening: the same navy as the game's own splash */ function fit(){ var v=window.visualViewport; e.style.bottom='auto'; e.style.height=(v?v.height:innerHeight)+'px'; e.style.top=(v?v.offsetTop:0)+'px'; } fit(); (window.visualViewport||window).addEventListener('resize',fit); })();   /* centred in what is really visible (iOS toolbars) */
(function(){ var F=[['three.min.js',603445],['dio.js',927378],['game.html',1440672]], got=[0,0,0], tot=F[0][1]+F[1][1]+F[2][1], bar=document.querySelector('#bar i'), pc=document.getElementById('pc');
 function up(){ var f=Math.min(1,(got[0]+got[1]+got[2])/tot), p=Math.min(99,Math.floor(f*100)), w=Math.min(97,100*(1-Math.pow(1-f,1.7))); bar.style.width=w.toFixed(1)+'%'; pc.textContent=p+'%'; }   /* the bar runs a little ahead of the number, so it is nearly full well before 100 */
 function get(i){ return fetch(F[i][0]).then(function(r){ if(!r.ok) throw 0; if(!r.body||!window.TextDecoder) return r.text().then(function(t){ got[i]=F[i][1]; up(); return t; });
   var rd=r.body.getReader(), dec=new TextDecoder(), txt=''; return (function pump(){ return rd.read().then(function(x){ if(x.done){ txt+=dec.decode(); got[i]=F[i][1]; up(); return txt; } got[i]+=x.value.length; up(); txt+=dec.decode(x.value,{stream:true}); return pump(); }); })(); }); }
 Promise.all([get(0),get(1),get(2)]).then(function(T){ var h=T[2].replace('<script src="three.min.js"><\/script>',function(){ return '<script>'+T[0]+'\n<\/script>'; }).replace('<script src="dio.js"><\/script>',function(){ return '<script>'+T[1]+'\n<\/script>'; });
   bar.style.width='100%'; pc.textContent='100%'; requestAnimationFrame(function(){ requestAnimationFrame(function(){ setTimeout(function(){ document.open(); document.write(h); document.close(); },180); }); }); })
 .catch(function(){ location.replace('game.html'); });
})();
</script></body></html>
